<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faro · Vincular WhatsApp</title><style>body{background:#0a1419;color:#e5efef;font:16px system-ui;margin:0;padding:24px}main{max-width:470px;margin:40px auto;background:#14262d;padding:28px;border-radius:22px}p{color:#a9bfc3;line-height:1.6}button,a{background:#51ddc0;border:0;border-radius:10px;padding:13px;color:#07372f;cursor:pointer}img{width:100%;max-width:320px;display:block;margin:24px auto}a{display:inline-block;text-decoration:none;background:transparent;color:#51ddc0}button:disabled{opacity:.5}</style><main><a href="/">← Faro</a><h1>Vincula tu WhatsApp</h1><p>En tu teléfono abre WhatsApp → Dispositivos vinculados → Vincular un dispositivo.</p><button id="connect">Obtener QR</button><p id="status" role="status">Necesitas una instancia de Evolution API v2 configurada.</p><img id="qr" hidden alt="QR temporal para vincular WhatsApp"><p>Escanea el QR aquí. Esta vinculación usa un servicio externo compatible con WhatsApp Web; no es la API oficial de Meta.</p></main><script>
const b=document.getElementById('connect'),s=document.getElementById('status'),q=document.getElementById('qr');b.onclick=async()=>{b.disabled=true;q.hidden=true;q.removeAttribute('src');s.textContent='Solicitando QR…';try{const r=await fetch('/api/whatsapp/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok)throw Error(d.error);if(d.connected){s.textContent='WhatsApp conectado.';return}if(typeof d.qr!=='string'||!/^data:image\/png;base64,[A-Za-z0-9+/=\r\n]+$/.test(d.qr))throw Error('No hay QR disponible. Verifica la instancia o solicita uno nuevo.');q.src=d.qr;q.hidden=false;s.textContent='Escanea este QR desde tu teléfono. Si vence, solicita otro.';setTimeout(()=>{q.hidden=true;q.removeAttribute('src');s.textContent='QR oculto por seguridad. Solicita otro si lo necesitas.'},45000)}catch(e){s.textContent=e.message||'No se pudo generar el QR.'}finally{b.disabled=false}};
</script></html>
